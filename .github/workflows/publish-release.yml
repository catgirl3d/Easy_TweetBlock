name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish
        required: true
        type: string

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: echo "tag=${REQUESTED_TAG:-${{ github.ref_name }}}" >> "$GITHUB_OUTPUT"

      - name: Verify requested tag exists
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: git ls-remote --exit-code --refs "https://github.com/${{ github.repository }}.git" "refs/tags/$RELEASE_TAG"

      - name: Check out repository at tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release tag against manifest version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: npm run validate:release-tag -- "$RELEASE_TAG"

      - name: Run test suite
        run: npm test

      - name: Build release packages
        run: npm run package

      - name: Run Firefox extension lint
        run: npm run lint

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: easy-tweetblock-packages-${{ steps.release_tag.outputs.tag }}
          path: dist
          if-no-files-found: error

      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: node scripts/extract-release-notes.js "$RELEASE_TAG" dist/release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/*.xpi
            dist/*.zip
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
